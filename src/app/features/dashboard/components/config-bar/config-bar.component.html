<div class="config-bar">
  <div class="cfg-sep">Configuração do financiamento</div>
  <div class="cfg-f">
    <label>Nº de parcelas</label>
    <input type="number" id="cfg-total" [ngModel]="cfgTotal()" (ngModelChange)="cfgTotal.set($event); autoFillFinanced()" min="1" max="600"/>
  </div>
  <div class="cfg-f">
    <label>Valor da parcela (R$)</label>
    <input type="number" id="cfg-valor" [ngModel]="cfgValue()" (ngModelChange)="cfgValue.set($event); autoFillFinanced()" min="0.01" step="0.01"/>
  </div>
  <div class="cfg-f">
    <label>Valor financiado (R$)</label>
    <input type="number" id="cfg-fin" [ngModel]="cfgFinanced()" (ngModelChange)="cfgFinanced.set($event)" min="0.01" step="0.01"/>
  </div>
  <button class="btn-ap" (click)="applyConfig()">Aplicar</button>
  <span class="saving-badge" id="saving-badge" [style.color]="saveLabelColor">{{ saveLabel }}</span>
</div>
