<div class="kpis" id="kpis">
  <div class="kpi">
    <div class="kpi-l">Pagas</div>
    <div class="kpi-v g">
      {{ financing.paidInstallments().length }}<span style="font-size:12px;color:var(--muted)">/{{ financing.installments().length }}</span>
    </div>
  </div>
  <div class="kpi">
    <div class="kpi-l">Em aberto</div>
    <div class="kpi-v a">{{ financing.openInstallments().length }}</div>
  </div>
  <div class="kpi">
    <div class="kpi-l">Total pago</div>
    <div class="kpi-v g" style="font-size:13px">{{ financing.totalPaid() | fmtCurrency }}</div>
  </div>
  <div class="kpi">
    <div class="kpi-l">Falta pagar</div>
    <div class="kpi-v a" style="font-size:13px">{{ financing.totalRemaining() | fmtCurrency }}</div>
  </div>
</div>
