<div id="app-screen">
  <app-topbar />
  <div class="app">
    @if (isLoading()) {
      <div id="app-loading" class="loading">
        <span class="dot-anim">Carregando seus dados</span>
      </div>
    } @else {
      <div id="app-content">
        <app-config-bar />
        <app-juros-box />
        <app-kpis />
        <app-progress-bar />
        <app-charts />
        <app-parcelas-table />
      </div>
    }
  </div>
</div>
